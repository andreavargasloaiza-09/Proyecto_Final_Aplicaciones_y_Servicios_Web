{% extends "base_app.html" %}

{% block titulo %}Técnico · Mesa de servicios de soporte{% endblock %}
{% block rol %}Técnico{% endblock %}

{% block contenido %}
  <main class="contenedor">
    <section class="tarjeta">
      <div class="titulo-fila">
        <h2>Casos asignados a mí</h2>
        <div class="controles">
          <select id="filtro-estado" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            {% for valor, etiqueta in estados.items() %}
              {% if valor != "reportado" %}<option value="{{ valor }}">{{ etiqueta }}</option>{% endif %}
            {% endfor %}
          </select>
          <button type="button" id="btn-actualizar" class="btn-sec">Actualizar</button>
        </div>
      </div>
      <div id="lista-casos"></div>
    </section>
  </main>
{% endblock %}

{% block scripts %}<script src="/static/js/tecnico.js"></script>{% endblock %}
