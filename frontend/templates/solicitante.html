{% extends "base_app.html" %}

{% block titulo %}Solicitante · Mesa de servicios de soporte{% endblock %}
{% block rol %}Solicitante{% endblock %}

{% block contenido %}
  <main class="contenedor dos-col">
    <section class="tarjeta">
      <h2>Reportar un caso</h2>
      <form id="form-reporte" novalidate>
        <label for="categoria">Categoría</label>
        <select id="categoria" required></select>

        <label for="descripcion">Descripción del fallo</label>
        <textarea id="descripcion" rows="4" maxlength="2000" required placeholder="¿Qué está ocurriendo?"></textarea>

        <label for="placa">Placa del equipo o recurso</label>
        <input id="placa" type="text" maxlength="50" required>

        <label for="nombre">Su nombre</label>
        <input id="nombre" type="text" maxlength="120" required>

        <label for="area">Área</label>
        <input id="area" type="text" maxlength="100" required>

        <label for="telefono">Teléfono de contacto</label>
        <input id="telefono" type="tel" maxlength="25" required placeholder="Ej: 3001234567">

        <p id="reporte-error" class="error" hidden></p>
        <button type="submit">Enviar reporte</button>
      </form>
    </section>

    <section class="tarjeta">
      <div class="titulo-fila">
        <h2>Mis casos</h2>
        <div class="controles">
          <select id="filtro-grupo" aria-label="Filtrar casos">
            <option value="">Todos</option>
            <option value="abiertos">Abiertos</option>
            <option value="cerrados">Cerrados</option>
          </select>
          <button type="button" id="btn-actualizar" class="btn-sec">Actualizar</button>
        </div>
      </div>
      <div id="lista-casos"></div>
    </section>
  </main>
{% endblock %}

{% block scripts %}<script src="/static/js/solicitante.js"></script>{% endblock %}
